[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
julie-core = { path = "crates/core" }
julie-text = { path = "crates/text" }
julie-diff = { path = "crates/diff" }
julie-vcs = { path = "crates/vcs" }
julie-index = { path = "crates/index" }
julie-phpunit = { path = "crates/phpunit" }
julie-terminal = { path = "crates/terminal" }
eframe = "0.37"

# Dépendances partagées par au moins deux crates : la version se fixe ici et nulle
# part ailleurs (voir docs/contrats.md, « Dépendances »). Une dépendance propre à une
# seule crate se déclare dans le Cargo.toml de cette crate.
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tempfile = "3"
# Chaque crate active les fonctionnalités Win32 dont elle a besoin.
windows-sys = "0.61"
# Analyse syntaxique : coloration (julie-text) et index des symboles (julie-index).
# Une seule version pour tout l'espace de travail : les arbres sont compatibles.
tree-sitter = "0.25"
tree-sitter-php = "0.24"
tree-sitter-html = "0.23"
tree-sitter-css = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"

[profile.dev]
# Débogage léger : compilation et édition de liens plus rapides sur cette machine partagée.
debug = "line-tables-only"

[profile.dev.package."*"]
# Les dépendances (egui, rendu) sont optimisées même en dev, sinon l'interface rame.
opt-level = 2
