[package]
name = "julie-index"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
julie-core.workspace = true
thiserror.workspace = true
serde.workspace = true
# Parcours respectant .gitignore (même moteur que ripgrep), masques de fichiers.
ignore = "0.4"
globset = "0.4"
regex = "1"
memchr = "2"
# Index des symboles et navigation : chaque crate analyse elle-même (pas de
# dépendance vers julie-text), mêmes versions que lui (espace de travail).
tree-sitter.workspace = true
tree-sitter-php.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-typescript.workspace = true

[dev-dependencies]
tempfile.workspace = true
