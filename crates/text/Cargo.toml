[package]
name = "julie-text"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
julie-core.workspace = true
thiserror.workspace = true
# Sans `unicode_lines` : seules \n, \r\n et \r séparent les lignes, comme dans
# `julie_core::file` (U+2028 et consorts restent des caractères ordinaires).
ropey = { version = "1.6", default-features = false, features = ["simd", "cr_lines"] }
unicode-segmentation = "1.12"
tree-sitter = "0.25"
tree-sitter-php = "0.24"
tree-sitter-html = "0.23"
tree-sitter-css = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"

[dev-dependencies]
tempfile.workspace = true
