[package]
name = "julie-text"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
julie-core.workspace = true
thiserror.workspace = true
# Sans `unicode_lines` : seules \n, \r\n et \r séparent les lignes, comme dans
# `julie_core::file` (U+2028 et consorts restent des caractères ordinaires).
ropey = { version = "1.6", default-features = false, features = ["simd", "cr_lines"] }
unicode-segmentation = "1.12"
tree-sitter.workspace = true
tree-sitter-php.workspace = true
tree-sitter-html.workspace = true
tree-sitter-css.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-typescript.workspace = true

[dev-dependencies]
tempfile.workspace = true
